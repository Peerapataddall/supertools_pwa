{% extends "base.html" %}
{% block content %}
<div class="pagehead">
  <div>
    <h1>{{ title }}</h1>
    <div class="muted">ช่วงวันที่: {{ start }} ถึง {{ end }}</div>
  </div>
  <div class="actions">
    <form method="get" class="d-flex gap-2 align-items-end">
      <div>
        <label class="form-label mb-1">เริ่มต้น</label>
        <input class="form-control" type="date" name="start" value="{{ start }}">
      </div>
      <div>
        <label class="form-label mb-1">สิ้นสุด</label>
        <input class="form-control" type="date" name="end" value="{{ end }}">
      </div>
      <div class="pb-0">
        <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> ดูรายงาน</button>
      </div>
      <div class="pb-0">
        <a class="btn btn-outline-light" href="{{ url_for(export_endpoint, start=start, end=end, export=1) }}">
          <i class="bi bi-file-earmark-excel"></i> Export Excel
        </a>
      </div>
    </form>
  </div>
</div>

<div class="card p-0">
  <div class="table-responsive">
    <table class="table table-dark table-hover mb-0">
      <thead>
        <tr>
          {% for h, _ in columns %}
          <th class="text-nowrap">{{ h }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for r in rows %}
        <tr>
          {% for _, k in columns %}
          <td class="text-nowrap">{{ r[k] }}</td>
          {% endfor %}
        </tr>
        {% else %}
        <tr>
          <td colspan="{{ columns|length }}" class="text-center text-white-50 py-4">
            ไม่มีข้อมูลในช่วงวันที่ที่เลือก
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
